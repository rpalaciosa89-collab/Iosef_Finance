name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: pip install pytest
      - name: Run tests
        env:
          JWT_SECRET_KEY: ci-test-key
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DATABASE_URL: sqlite:///./ci_test.db
        run: python -m pytest tests/ -v
      - name: Alembic no-drift check
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          rm -f ci_migrations.db
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run test
      - run: npm run lint || true
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    defaults:
      run:
        working-directory: frontend-v2
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        working-directory: backend
        run: |
          pip install -e .
          nohup uvicorn server:app --host 127.0.0.1 --port 8002 &
      - name: Install frontend + browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E
        env:
          JWT_SECRET_KEY: ci-test-key
          REDIS_HOST: localhost
        run: npm run e2e
